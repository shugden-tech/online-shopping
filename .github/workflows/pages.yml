# Publishes a preview of the storefront to GitHub Pages on every push to genzst.
# Needs: Settings → Pages → Source = "GitHub Actions" (set once in the repo).
name: Deploy GitHub Pages preview

on:
  push:
    branches: [genzst]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build for GitHub Pages (base /online-shopping)
        run: npm run build
        env:
          GH_PAGES: "1"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/online-shopping

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
